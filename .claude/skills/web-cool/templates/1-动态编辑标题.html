<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动态编辑标题</title>
<style>
  :root{--paper:#FAF9F5;--ink:#141413;--clay:#D97757;--mut:#6b6a63;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--paper);color:var(--ink);overflow:hidden;
    font-family:system-ui,"PingFang SC",sans-serif;}
  nav{display:flex;justify-content:space-between;align-items:center;
    padding:34px min(7vw,72px);font-size:15px;letter-spacing:.2px;}
  nav .brand{font-weight:600;}
  nav .brand i{display:inline-block;width:9px;height:9px;background:var(--clay);
    border-radius:50%;margin-right:9px;vertical-align:middle;}
  nav .links a{margin-left:30px;color:var(--mut);text-decoration:none;}
  nav .links a:hover{color:var(--ink);}
  main{height:calc(100% - 96px);display:flex;flex-direction:column;justify-content:center;
    padding:0 min(7vw,72px);max-width:1100px;}
  .eyebrow{font-size:14px;letter-spacing:3px;color:var(--clay);text-transform:uppercase;
    margin-bottom:26px;opacity:0;animation:rise .8s .1s forwards;}
  h1{font-family:"Tiempos",Georgia,"Songti SC",serif;font-weight:500;
    font-size:min(9vw,88px);line-height:1.08;letter-spacing:-1px;}
  h1 .w{display:inline-block;opacity:0;transform:translateY(28px);animation:rise .9s forwards;}
  .cycle{color:var(--clay);position:relative;}
  p.sub{margin-top:30px;font-size:min(4.4vw,20px);line-height:1.6;color:var(--mut);
    max-width:560px;opacity:0;animation:rise .9s .9s forwards;}
  .line{height:1px;background:var(--ink);width:0;margin-top:46px;animation:grow 1.1s 1s forwards;}
  @keyframes rise{to{opacity:1;transform:none;}}
  @keyframes grow{to{width:min(46vw,420px);}}
</style>
</head>
<body>
<nav>
  <div class="brand"><i></i>STUDIO / 工作室</div>
  <div class="links"><a href="#">作品</a><a href="#">理念</a><a href="#">联系</a></div>
</nav>
<main>
  <div class="eyebrow">Design · 二〇二六</div>
  <h1><span class="w" style="animation-delay:.25s">让好的想法</span><br>
      <span class="w" style="animation-delay:.45s">自由</span>
      <span class="w cycle" id="cyc" style="animation-delay:.6s">生长</span></h1>
  <p class="sub">克制的设计，温暖的表达。把复杂收敛成一句话，把一句话展开成体验。</p>
  <div class="line"></div>
</main>
<script>
  const words=["生长","成型","呼吸","发光"], el=document.getElementById('cyc');
  let i=0;
  setInterval(()=>{
    el.style.transition="opacity .4s, transform .4s";
    el.style.opacity="0"; el.style.transform="translateY(-10px)";
    setTimeout(()=>{ i=(i+1)%words.length; el.textContent=words[i];
      el.style.transform="translateY(10px)";
      requestAnimationFrame(()=>{el.style.opacity="1";el.style.transform="none";});
    },420);
  },2200);
</script>
</body>
</html>
