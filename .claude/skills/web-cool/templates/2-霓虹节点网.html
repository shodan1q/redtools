<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霓虹节点网</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0018;
    font-family:-apple-system,"PingFang SC",sans-serif;}
  .hud{position:fixed;top:8vh;left:0;width:100%;text-align:center;pointer-events:none;color:#fff;}
  .hud h1{margin:0;font-size:min(10vw,72px);font-weight:900;letter-spacing:4px;
    background:linear-gradient(90deg,#00f5d4,#7b6cff,#ff3ca6);-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(123,108,255,.5));}
  .hud p{margin:10px 0 0;font-size:min(4vw,16px);color:#8b7fb8;letter-spacing:6px;}
</style>
</head>
<body>
<div class="hud"><h1>NEURAL WEB</h1><p>移动鼠标 · 唤醒节点</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
let pts=[], LINK=150, N;
function setup(){
  createCanvas(windowWidth,windowHeight);
}
function seed(){                       // 尺寸就绪后再播种，避免首帧 0 尺寸
  N=Math.max(90,Math.min(160,Math.floor(width*height/14000)));
  pts=[];
  for(let i=0;i<N;i++) pts.push({x:random(width),y:random(height),
    vx:random(-.6,.6),vy:random(-.6,.6)});
}
function draw(){
  if(pts.length===0 && width>1){ seed(); }
  background(10,0,24,60);           // 拖尾
  if(pts.length===0) return;
  // 连线
  for(let i=0;i<N;i++){
    const a=pts[i];
    // 更新
    a.x+=a.vx;a.y+=a.vy;
    if(a.x<0||a.x>width)a.vx*=-1;
    if(a.y<0||a.y>height)a.vy*=-1;
    for(let j=i+1;j<N;j++){
      const b=pts[j], d=dist(a.x,a.y,b.x,b.y);
      if(d<LINK){
        const al=map(d,0,LINK,180,0);
        stroke(0,245,212,al*0.6); strokeWeight(1);
        line(a.x,a.y,b.x,b.y);
      }
    }
    // 鼠标连线（高亮）
    const dm=dist(a.x,a.y,mouseX,mouseY);
    if(dm<200){
      stroke(255,60,166,map(dm,0,200,220,0)); strokeWeight(1.4);
      line(a.x,a.y,mouseX,mouseY);
    }
  }
  // 节点辉光
  noStroke();
  for(const p of pts){
    const dm=dist(p.x,p.y,mouseX,mouseY);
    const glow=dm<200?map(dm,0,200,10,3):3;
    fill(123,108,255,60); circle(p.x,p.y,glow*2.6);
    fill(180,240,255); circle(p.x,p.y,glow);
  }
}
function windowResized(){resizeCanvas(windowWidth,windowHeight);}
</script>
</body>
</html>
