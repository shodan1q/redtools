<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玻璃拟态着陆页</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif;
    background:#0b0a1a;color:#fff;}
  /* 漂浮渐变光球 */
  .orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.75;z-index:0;}
  .o1{width:46vw;height:46vw;background:#5b4bff;left:-8vw;top:-8vw;animation:f1 14s ease-in-out infinite;}
  .o2{width:40vw;height:40vw;background:#ff3ca6;right:-6vw;top:10vh;animation:f2 17s ease-in-out infinite;}
  .o3{width:38vw;height:38vw;background:#00d4ff;left:20vw;bottom:-12vw;animation:f3 20s ease-in-out infinite;}
  .o4{width:26vw;height:26vw;background:#ffb057;right:18vw;bottom:2vh;animation:f1 16s ease-in-out infinite;}
  @keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(6vw,5vh)}}
  @keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vw,7vh)}}
  @keyframes f3{0%,100%{transform:translate(0,0)}50%{transform:translate(4vw,-6vh)}}
  /* 磨砂玻璃卡 */
  .wrap{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;}
  .card{width:min(88vw,560px);padding:48px 44px;border-radius:28px;text-align:center;
    background:rgba(255,255,255,.08);backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);}
  .badge{display:inline-block;padding:7px 16px;border-radius:999px;font-size:13px;letter-spacing:1px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#dfe3ff;margin-bottom:22px;}
  h1{font-size:min(11vw,52px);font-weight:800;line-height:1.15;letter-spacing:1px;
    background:linear-gradient(120deg,#fff,#b8c6ff 60%,#ff9ed8);-webkit-background-clip:text;
    background-clip:text;color:transparent;}
  p.sub{margin:16px 0 30px;color:#c3c8e6;font-size:min(4.2vw,17px);line-height:1.7;}
  .btn{display:inline-block;padding:15px 38px;border-radius:999px;font-size:16px;font-weight:700;
    color:#12102a;text-decoration:none;
    background:linear-gradient(90deg,#7cf7ff,#a68bff,#ff8ad4);
    box-shadow:0 8px 30px rgba(140,120,255,.55);transition:transform .2s;}
  .btn:hover{transform:translateY(-2px) scale(1.03);}
  .stats{display:flex;gap:26px;justify-content:center;margin-top:34px;}
  .stat b{display:block;font-size:24px;
    background:linear-gradient(90deg,#7cf7ff,#ff8ad4);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat span{font-size:12px;color:#9aa0c7;letter-spacing:1px;}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>
<div class="wrap">
  <div class="card">
    <span class="badge">✦ 全新一代 · AI 驱动</span>
    <h1>让创意<br>瞬间成型</h1>
    <p class="sub">从一个想法到惊艳成品，只需一句话。<br>玻璃拟态 · 渐变光效 · 即刻惊艳。</p>
    <a class="btn" href="#">立即体验 →</a>
    <div class="stats">
      <div class="stat"><b>10万+</b><span>创作者</span></div>
      <div class="stat"><b>99%</b><span>好评</span></div>
      <div class="stat"><b>3秒</b><span>出图</span></div>
    </div>
  </div>
</div>
</body>
</html>
