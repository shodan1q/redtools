<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子星系</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060d;font-family:-apple-system,"PingFang SC",sans-serif;}
  #c{display:block;}
  .hud{position:fixed;left:6vw;bottom:7vh;color:#fff;pointer-events:none;}
  .hud h1{margin:0;font-size:min(9vw,64px);font-weight:800;letter-spacing:2px;
    background:linear-gradient(90deg,#7cf7ff,#a68bff,#ff8ad4);-webkit-background-clip:text;
    background-clip:text;color:transparent;text-shadow:0 0 40px rgba(140,120,255,.3);}
  .hud p{margin:8px 0 0;font-size:min(4vw,17px);color:#9aa3c7;letter-spacing:4px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><h1>PARTICLE GALAXY</h1><p>移动鼠标 · 旋转星河</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
camera.position.set(0,3.2,6);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));

// ---- 生成螺旋星系粒子 ----
const N=22000, R=6, BRANCHES=4, SPIN=1.1, RAND=0.55;
const pos=new Float32Array(N*3), col=new Float32Array(N*3);
const cIn=new THREE.Color('#ff9d5c'), cOut=new THREE.Color('#5b7bff');
for(let i=0;i<N;i++){
  const r=Math.pow(Math.random(),1.5)*R;
  const branch=(i%BRANCHES)/BRANCHES*Math.PI*2;
  const spin=r*SPIN;
  const rx=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*RAND*r;
  const ry=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*RAND*r*0.4;
  const rz=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*RAND*r;
  pos[i*3]=Math.cos(branch+spin)*r+rx;
  pos[i*3+1]=ry;
  pos[i*3+2]=Math.sin(branch+spin)*r+rz;
  const c=cIn.clone().lerp(cOut,r/R);
  col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
const mat=new THREE.PointsMaterial({size:0.045,sizeAttenuation:true,depthWrite:false,
  blending:THREE.AdditiveBlending,vertexColors:true,transparent:true,opacity:0.9});
const galaxy=new THREE.Points(geo,mat);scene.add(galaxy);

// 中心辉光
const core=new THREE.Mesh(new THREE.SphereGeometry(0.25,32,32),
  new THREE.MeshBasicMaterial({color:0xfff0d0}));scene.add(core);

let mx=0,my=0;
addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5);});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});

const clock=new THREE.Clock();
(function loop(){
  const t=clock.getElapsedTime();
  galaxy.rotation.y=t*0.12;
  camera.position.x+= (mx*3.2-camera.position.x)*0.04;
  camera.position.y+= (3.2-my*2.4-camera.position.y)*0.04;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
